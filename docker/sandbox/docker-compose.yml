name: iris-sandbox

services:
  runner:
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile.runner
    image: iris-sandbox-runner:local
    command:
      - node
      - --import
      - tsx
      - scripts/sandbox-runner.ts
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      SANDBOX_RUNNER_HOST: 0.0.0.0
      SANDBOX_RUNNER_PORT: 8787
      # Development-only credential for this loopback-bound standalone stack.
      SANDBOX_RUNNER_TOKEN: iris-sandbox-local-development-token-2026-only
      SANDBOX_RUNNER_IMAGE: sha256:03f539e2c57f7f0456f76ae890bbca689b716c682b13318009902e31006ce212
      SANDBOX_RUNNER_RUNTIME: runsc
      SANDBOX_RUNNER_SOCKET: /var/run/docker.sock
      SANDBOX_RUNNER_CHILD_BROKER_NETWORK: iris-sandbox-child-broker
      SANDBOX_RUNNER_MAX_CONCURRENT_SESSIONS: ${SANDBOX_RUNNER_MAX_CONCURRENT_SESSIONS:-4}
      SANDBOX_RUNTIME: runsc
      SANDBOX_RUNTIME_IMAGE: iris-sandbox-runtime:local
    ports:
      - 127.0.0.1:8787:8787
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/ready',{headers:{authorization:'Bearer '+process.env.SANDBOX_RUNNER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: "no"

  package-broker:
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile.package-broker
    image: iris-sandbox-package-broker:local
    networks:
      - child-broker
      - broker-egress
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 2s
      retries: 12
    restart: unless-stopped

  runtime-smoke:
    profiles:
      - smoke
    build:
      context: ../..
      dockerfile: docker/sandbox/Dockerfile.runtime
    image: iris-sandbox-runtime:local
    runtime: runsc
    command:
      - python
      - /usr/local/bin/runtime-smoke.py
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /workspace:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64

networks:
  control:
    name: iris-sandbox-control
    internal: true
  child-broker:
    name: iris-sandbox-child-broker
    internal: true
  broker-egress:
    name: iris-sandbox-broker-egress
