services:
  iris-os:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NO_HTTPS=1
      - POSTGRES_URL=${POSTGRES_URL:?set POSTGRES_URL}
      - IRIS_ROOT_ENCRYPTION_KEY=${IRIS_ROOT_ENCRYPTION_KEY:?set IRIS_ROOT_ENCRYPTION_KEY}
    dns:
      - 8.8.8.8 # Google's public DNS server
      - 8.8.4.4 # Google's public DNS server
    networks:
      - iris-os-network
    depends_on:
      - postgres
    restart: unless-stopped

  iris-worker:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      target: worker
    command:
      - node
      - --conditions=react-server
      - --import
      - tsx
      - scripts/iris-worker.ts
    environment:
      - POSTGRES_URL=${POSTGRES_URL:?set POSTGRES_URL}
      - IRIS_ROOT_ENCRYPTION_KEY=${IRIS_ROOT_ENCRYPTION_KEY:?set IRIS_ROOT_ENCRYPTION_KEY}
    networks:
      - iris-os-network
    depends_on:
      - postgres
    restart: unless-stopped

  memory-worker:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      target: worker
    command:
      - node
      - --conditions=react-server
      - --import
      - tsx
      - scripts/memory-worker.ts
    environment:
      - POSTGRES_URL=${POSTGRES_URL:?set POSTGRES_URL}
      - IRIS_ROOT_ENCRYPTION_KEY=${IRIS_ROOT_ENCRYPTION_KEY:?set IRIS_ROOT_ENCRYPTION_KEY}
    networks:
      - iris-os-network
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-iris}
      - POSTGRES_USER=${POSTGRES_USER:-iris}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-iris-local-only}
    networks:
      - iris-os-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - iris-os-network
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c "until mc alias set iris http://minio:9000
      $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      do sleep 2; done; mc mb --ignore-existing iris/iris"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    networks:
      - iris-os-network

volumes:
  postgres_data:
  minio_data:

networks:
  iris-os-network:
    driver: bridge
